name: Release

# Push a tag like `v1.1.0` to build every target and publish a GitHub Release with the archives attached.
# Pull requests that touch the code (and manual runs from the Actions tab) build and smoke-test every target without
# publishing anything: the archives are only uploaded as workflow artifacts.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "src/**"
      - "include/**"
      - "meson.build"
      - "meson_options.txt"
      - "samples/**"
      - "bot/**"
      - "install/**"
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            os: macos-15
          - target: macos-x86_64 # cross-compiled on Apple Silicon, smoke-tested under Rosetta 2 when available
            os: macos-15
          - target: linux-x86_64
            os: ubuntu-24.04
          - target: windows-x86_64
            os: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install meson + ninja
        run: python -m pip install meson ninja

      - name: Select newest stable Xcode (macOS)
        if: runner.os == 'macOS'
        # C++23 <print> needs a recent libc++; don't depend on the runner image's default Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        # clang + libstdc++ 14 (needed for C++23 <print>); the static libc/libstdc++ archives come with the -dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-19 g++-14
          echo "CC=clang-19" >> "$GITHUB_ENV"
          echo "CXX=clang++-19" >> "$GITHUB_ENV"

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build, test and package
        run: .github/scripts/build-release.sh "${{ matrix.target }}" "${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}"

      - uses: actions/upload-artifact@v4
        with:
          name: mtce-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  # the web front end as one file (bot/web.ts bundled with its dependencies) plus its page; it needs only Node.js to run, which
  # the installers download
  web:
    name: build (web front end)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Bundle and package
        working-directory: bot
        run: |
          version="${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}"
          npm ci
          npm run build:web
          stage="../dist/mtce-web-$version"
          mkdir -p "$stage"
          cp -R dist-web/. "$stage/"
          cp ../LICENSE "$stage/"
          # smoke test: the bundle must start without node_modules
          (cd "$stage" && node web.mjs --help)
          cd ../dist && zip -qr "mtce-web-$version.zip" "mtce-web-$version"

      - uses: actions/upload-artifact@v4
        with:
          name: mtce-web
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: publish release
    if: github.ref_type == 'tag'
    needs: [build, web]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Add installers and checksums
        # the installers download from releases/latest and verify every file against SHA256SUMS.txt
        run: |
          cp install/install-mac.sh install/install-mac.command install/install-windows.ps1 install/install-windows.bat dist/
          cd dist && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "mtce ${{ github.ref_name }}" \
            --generate-notes
